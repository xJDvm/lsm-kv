[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lsm-kv"
version = "0.1.0"
description = "An embedded, persistent key-value store built on a log-structured merge tree, in pure Python."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Diego Valdés M." }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.17",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lsmkv"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
